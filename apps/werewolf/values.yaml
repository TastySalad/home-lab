# Werewolf Helm values — home-lab defaults.
#
# Image `werewolf:1.0.0` is built locally (buildah on salad-playground) and
# imported into k3s's containerd on the target node, so `pullPolicy:
# IfNotPresent` + no imagePullSecrets is the intended flow. No external
# registry is involved and no credits are spent.

replicaCount: 1

image:
  repository: werewolf
  tag: "1.2.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: LoadBalancer
  port: 80
  targetPort: 8090
  # MetalLB pool is 192.168.0.60-100; .60 (traefik), .61 (vault), .63 (netdata)
  # are in use. .62 is the werewolf LAN address (phone browsers hit http://192.168.0.62).
  loadBalancerIP: 192.168.0.62

# Stateful game table — pin to the healthy LAN node ("Blackview" per lab naming).
# salad-vostro3500 is an offline laptop and must never be a target.
nodeSelector:
  kubernetes.io/hostname: salad-playground

tolerations: []
affinity: {}

# The server is tiny (pure stdlib): ~30-60 MB RSS in real use.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

env:
  WEREWOLF_PORT: "8090"
  # 1.2.0 phase pacing (seconds). The night ends the moment every night-actor
  # has acted; NIGHT_SECONDS is only a hard backstop so one stuck player can't
  # hold the village hostage. DAY_DELIB is the discussion window; the host can
  # stretch/shrink it live. The stand/verdict windows are fixed in-code.
  NIGHT_SECONDS: "120"
  DAY_DELIB_SECONDS: "90"
  ACCUSE_THRESHOLD: "3"      # accusations needed to send someone to the stand
  ACCUSATIONS_PER_DAY: "3"   # stand attempts per day before the town sleeps
  PLEA_SECONDS: "45"         # pleading time on the stand
  VERDICT_SECONDS: "60"      # hang/free decision window

# Liveness/readiness hit the static server (any HTTP status means the process
# is alive; 404 on a path is expected for a raw TCP+HTTP stdlib server, so we
# treat "got any HTTP response" as alive).
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

# server.py binds 0.0.0.0:$WEREWOLF_PORT directly; no nginx sidecar needed.
extraArgs: []
