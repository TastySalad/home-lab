apiVersion: v2
name: werewolf
description: >-
  Werewolf — local multiplayer party game (mobile-first web, realtime WS).
  Single stateful game server (stdlib-Python asyncio HTTP + WebSocket) with a
  pre-built vanilla-JS frontend baked into the image. One table at a time;
  players join from their phones on the LAN.
