# ClusterIP only — external access goes through nginx proxy on racknerd-vps
# forwarding via Tailscale to the Minecraft pod on salad-playground.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  type: ClusterIP
  selector:
    app: minecraft
  ports:
    - name: game
      port: 25565
      targetPort: game
      protocol: TCP