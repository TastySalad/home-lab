# Service for DNS/internal resolution. External access goes through
# the VPS public IP via hostNetwork. No MetalLB LoadBalancer needed.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  type: ClusterIP
  selector:
    app: minecraft
  ports:
    - name: game
      port: 25565
      targetPort: game
      protocol: TCP
      # Optional explicit node port when you prefer predictable local forwarding:
      # nodePort: 30565
