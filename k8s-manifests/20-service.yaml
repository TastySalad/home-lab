# Type LoadBalancer works with in-cluster MetalLB; allocate from the
# 192.168.0.60–100 pool for internal cluster access.
# External access goes through racknerd-vps which DNATs port 25565 to this IP.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  type: LoadBalancer
  selector:
    app: minecraft
  ports:
    - name: game
      port: 25565
      targetPort: game
      protocol: TCP