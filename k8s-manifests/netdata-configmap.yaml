apiVersion: v1
kind: ConfigMap
metadata:
  name: netdata-health
  namespace: netdata
  labels:
    app: netdata
data:
  ram.conf: |
    # High memory alarm — triggers webhook to Hermes for investigation
    alarm: ram_high
    on: system.ram
    lookup: average - 1m of used
    units: MiB
    every: 30s
    crit: $this > 80
    warn: $this > 70
    delay: up 2m
    repeat: warning 2m crit 2m
    exec: /etc/netdata/scripts/netdata-alert-webhook.sh
    info: System RAM usage alert — fires when memory exceeds threshold
  netdata-alert-webhook.sh: |
    #!/bin/bash
    # Netdata alarm handler — collects diagnostics, POSTs to Hermes webhook

    WEBHOOK_URL="http://127.0.0.1:8644/webhooks/netdata-alerts"
    WEBHOOK_SECRET="netdata-hook-local-secret"

    # Quick diagnostics
    MEM_INFO=$(free -h 2>/dev/null | head -3)
    TOP_PROCS=$(ps aux --sort=-%mem 2>/dev/null | head -6)
    LOAD_INFO=$(uptime 2>/dev/null)
    SWAP_INFO=$(free -h 2>/dev/null | grep Swap)
    DISK_INFO=$(df -h / 2>/dev/null | tail -1)

    PAYLOAD=$(cat <<PAYLOAD_END
    {
      "alert": {
        "name": "${NETDATA_ALARM_NAME:-unknown}",
        "value": "${NETDATA_ALARM_VALUE:-?}",
        "status": "${NETDATA_ALARM_STATUS:-?}",
        "chart": "${NETDATA_CHART_NAME:-?}",
        "host": "${NETDATA_HOSTNAME:-salad-playground}"
      },
      "diagnostics": {
        "memory": $(echo "$MEM_INFO" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))" 2>/dev/null || echo "\"$MEM_INFO\""),
        "top_processes": $(echo "$TOP_PROCS" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))" 2>/dev/null || echo "\"$TOP_PROCS\""),
        "load": $(echo "$LOAD_INFO" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))" 2>/dev/null || echo "\"$LOAD_INFO\""),
        "swap": $(echo "$SWAP_INFO" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))" 2>/dev/null || echo "\"$SWAP_INFO\""),
        "disk": $(echo "$DISK_INFO" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))" 2>/dev/null || echo "\"$DISK_INFO\"")
      }
    }
    PAYLOAD_END
    )

    SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)

    curl -s -X POST "$WEBHOOK_URL" \
      -H "Content-Type: application/json" \
      -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
      -d "$PAYLOAD" \
      -o /dev/null -w "%{http_code}" 2>/dev/null