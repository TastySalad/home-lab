# Minimal Bearer-token auth sidecar (stdlib http.server, no deps).
#
# Reads the expected token from the file at $LLAMA_TOKEN_FILE (the k8s Secret
# `llama-token` key `token`, mounted read-only). On GET /auth:
#   - Authorization: Bearer <token> matching the file  -> 200
#   - anything else                                     -> 401
#
# This is the auth_request target for nginx. It never sees the real request
# body (nginx sends proxy_pass_request_body off).
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-auth-script
  namespace: llama
  labels:
    app: llama
data:
  auth_server.py: |
    import os
    import hmac
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TOKEN_FILE = os.environ.get("LLAMA_TOKEN_FILE", "/etc/llama/token")

    def _expected():
        # Re-read each request so a secret rotation is picked up without restart.
        try:
            with open(TOKEN_FILE, "r", encoding="utf-8") as f:
                return f.read().strip()
        except Exception:
            return None

    class Handler(BaseHTTPRequestHandler):
        def _decide(self):
            got = (self.headers.get("Authorization") or "").strip()
            exp = _expected()
            ok = bool(exp) and hmac.compare_digest(got, "Bearer " + exp)
            if ok:
                self.send_response(200)
            else:
                self.send_response(401)
                self.send_header("WWW-Authenticate", "Bearer")
            self.send_header("Content-Length", "0")
            self.end_headers()

        do_GET = do_POST = do_HEAD = _decide

        def log_message(self, *a):  # keep logs quiet
            pass

    if __name__ == "__main__":
        port = int(os.environ.get("AUTH_PORT", "8081"))
        ThreadingHTTPServer(("127.0.0.1", port), Handler).serve_forever()
