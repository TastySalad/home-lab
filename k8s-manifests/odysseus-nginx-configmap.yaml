# Reverse-proxy config for odysseus (host venv app on salad-playground:7000).
# - WebSocket/SSE friendly (Upgrade, Connection, buffering off)
# - Long read/send timeouts for agent operations
# - X-Forwarded-* so the app sees https (core/middleware.py checks X-Forwarded-Proto)
apiVersion: v1
kind: ConfigMap
metadata:
  name: odysseus-nginx-config
  namespace: odysseus
  labels:
    app: odysseus
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      upstream odysseus_backend {
        # Host app is bound 0.0.0.0:7000 on salad-playground (LAN router IP).
        server 192.168.0.1:7000;
        keepalive 16;
      }

      server {
        listen 80;
        client_max_body_size 2048m;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;

        location / {
          proxy_pass http://odysseus_backend;
          proxy_set_header Host $host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Forwarded-Host $host;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_connect_timeout 10s;
          chunked_transfer_encoding on;
        }
      }
    }
