apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: racknerd-vps
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          ports:
            - name: game
              containerPort: 25565
              hostPort: 25565
              protocol: TCP
          env:
            - name: EULA
              value: "TRUE"
            - name: MEMORY
              value: "1G"
            - name: JVM_OPTS
              value: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+DisableExplicitGC"
            - name: SERVER_PORT
              value: "25565"
            - name: OVERRIDE_SERVER_PROPERTIES
              value: "view-distance=6,max-players=10"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: game
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: game
            initialDelaySeconds: 120
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
